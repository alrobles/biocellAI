[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biocellai"
version = "0.1.0a2"
description = "Experimental sandbox: open language models x single-cell biology"
requires-python = ">=3.11"
dependencies = [
    "numpy<3",
    "pandas",
    "torch>=2.2",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
data = [
    "scanpy>=1.10",
    "anndata>=0.10",
    "cellxgene-census>=1.16",
]
text = [
    "sentence-transformers>=2.7",
]
dev = [
    "pytest>=8",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
